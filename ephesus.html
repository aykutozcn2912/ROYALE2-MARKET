<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Ephesus İlan Pazarı | Royale2 Market
  </title>

  <meta
    name="description"
    content="Royale2 Ephesus sunucusu Yang, eşya, karakter ve hesap ilanları."
  >

  <!-- MEVCUT SİTE TASARIMI -->
  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="topbar">

    <div class="container topbar-inner">

      <a
        href="index.html"
        class="brand"
      >
        <strong>ROYALE2</strong>
        <span>MARKET</span>
      </a>


      <nav class="main-nav">

        <a href="index.html">
          Ana Sayfa
        </a>

        <a
          href="ephesus.html"
          class="active"
        >
          Ephesus
        </a>

        <a href="#">
          Teos
        </a>

        <a href="#">
          Pergamon
        </a>

        <a href="#">
          Akademi Teos
        </a>

      </nav>


      <div class="actions">

        <a
          href="messages.html"
          class="btn ghost"
        >
          Mesajlar
        </a>

        <a
          href="create-listing.html"
          class="btn primary"
        >
          + İlan Ver
        </a>

      </div>

    </div>

  </header>


  <!-- =====================================================
       EPHESUS PAZAR
  ====================================================== -->

  <main>

    <section
      class="section ephesus-market-page"
      id="ephesus-market"
    >

      <div class="container">

        <!-- SAYFA BAŞLIĞI -->

        <div class="section-head">

          <div>

            <span class="eyebrow">
              ROYALE2 MARKET
            </span>

            <h1>
              Ephesus İlan Pazarı
            </h1>

            <p id="ephesusListingCount">
              İlanlar yükleniyor...
            </p>

          </div>

        </div>


        <!-- =================================================
             ARAMA + SIRALAMA
        ================================================== -->

        <div class="ephesus-market-toolbar">

          <div class="ephesus-search">

            <label
              for="ephesusSearch"
              class="sr-only"
            >
              İlanlarda ara
            </label>

            <input
              id="ephesusSearch"
              type="search"
              placeholder="İlanlarda ara..."
              autocomplete="off"
            >

          </div>


          <div class="ephesus-sort">

            <label
              for="ephesusSort"
              class="sr-only"
            >
              İlanları sırala
            </label>

            <select id="ephesusSort">

              <option value="newest">
                Önce En Yeni
              </option>

              <option value="oldest">
                Önce En Eski
              </option>

              <option value="price-asc">
                Fiyat (Artan)
              </option>

              <option value="price-desc">
                Fiyat (Azalan)
              </option>

            </select>

          </div>

        </div>


        <!-- =================================================
             KATEGORİ FİLTRELERİ
        ================================================== -->

        <div
          class="ephesus-category-filters"
          role="group"
          aria-label="Ephesus ilan kategorileri"
        >

          <button
            type="button"
            class="ephesus-filter active"
            data-category="Tümü"
          >
            Tüm İlanlar
          </button>


          <button
            type="button"
            class="ephesus-filter"
            data-category="Yang"
          >
            Yang
          </button>


          <button
            type="button"
            class="ephesus-filter"
            data-category="Eşya"
          >
            İtem
          </button>


          <button
            type="button"
            class="ephesus-filter"
            data-category="Karakter"
          >
            Karakter
          </button>


          <button
            type="button"
            class="ephesus-filter"
            data-category="Hesap"
          >
            Hesap
          </button>

        </div>


        <!-- =================================================
             İLAN DURUMU
        ================================================== -->

        <div
          id="ephesusMarketStatus"
          class="ephesus-market-status"
          aria-live="polite"
        >
          Ephesus ilanları yükleniyor...
        </div>


        <!-- =================================================
             İLAN KARTLARI
        ================================================== -->

        <div
          id="ephesusListings"
          class="listing-grid"
        ></div>


        <!-- =================================================
             BOŞ SONUÇ
        ================================================== -->

        <div
          id="ephesusEmptyState"
          class="ephesus-empty-state"
          hidden
        >

          <h3>
            İlan bulunamadı
          </h3>

          <p>
            Arama veya kategori filtrelerini
            değiştirerek tekrar deneyebilirsin.
          </p>

        </div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="footer">

    <div class="container">

      <p>
        © 2026 Royale2 Market
      </p>

    </div>

  </footer>


  <!-- =====================================================
       SUPABASE REALTIME KÜTÜPHANESİ
  ====================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- =====================================================
       MEVCUT ANA JAVASCRIPT
  ====================================================== -->

  <script src="script.js"></script>

</body>

</html>
